services:
  extremelynaggybot:
    image: docker.decryptology.net/decryptology/extremelynaggybot:latest
    # To build from source instead of pulling: docker compose up -d --build
    build: .
    container_name: extremelynaggybot
    restart: unless-stopped
    env_file: .env
    volumes:
      # The container runs as uid 10001; the directory must be writable by it:
      #   mkdir -p data && sudo chown 10001:10001 data
      - ./data:/app/data
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
