name: CI

# Uses shell steps only: the runner has no Node.js, so JavaScript actions such as
# actions/checkout cannot run. Each job runs in an image that already has its tools.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  IMAGE: docker.decryptology.net/decryptology/extremelynaggybot

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest
    container:
      image: rust:1-bookworm
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          auth=$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic $auth" fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Install components
        run: rustup component add clippy rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  docker:
    name: Build and push image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container:
      image: docker:cli
    defaults:
      run:
        shell: sh
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git >/dev/null
          git init -q .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          auth=$(printf 'oauth2:%s' "$TOKEN" | base64 -w0)
          git -c "http.extraheader=Authorization: Basic $auth" fetch -q --depth 1 origin "${{ github.sha }}"
          git checkout -q FETCH_HEAD

      - name: Log in to registry
        env:
          REPO_USERNAME: ${{ secrets.REPO_USERNAME }}
          REPO_PASSWORD: ${{ secrets.REPO_PASSWORD }}
        run: echo "$REPO_PASSWORD" | docker login docker.decryptology.net -u "$REPO_USERNAME" --password-stdin

      - name: Build
        run: docker build --pull -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .

      - name: Push
        run: docker push --all-tags "$IMAGE"
